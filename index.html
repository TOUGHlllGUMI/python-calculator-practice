<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #3a2a6e, transparent 55%),
                radial-gradient(circle at 80% 0%, #1e3a5f, transparent 50%),
                radial-gradient(circle at 50% 100%, #6e2a5e, transparent 55%),
                #0e0e1a;
    background-attachment: fixed;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .calculator {
    width: 320px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  #display {
    width: 100%;
    min-height: 84px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #ffffff;
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 34px;
    text-align: right;
    padding: 12px 18px;
    border-radius: 18px;
    margin-bottom: 16px;
    box-sizing: border-box;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-shadow: 0 0 18px rgba(167, 139, 250, 0.55);
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    height: 58px;
    font-family: "JetBrains Mono", monospace;
    font-size: 19px;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.07);
    color: #f0eefc;
    transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    filter: brightness(1.2);
    box-shadow: 0 0 16px rgba(167, 139, 250, 0.35);
  }

  button:active { transform: scale(0.94); }

  button.operator {
    background: linear-gradient(135deg, #f7971e, #ff5e62);
    color: #ffffff;
    border: none;
  }

  button.equals {
    background: linear-gradient(135deg, #38ef7d, #11998e);
    color: #ffffff;
    border: none;
    grid-row: span 2;
  }

  button.clear {
    background: linear-gradient(135deg, #ff5f6d, #a3195b);
    color: #ffffff;
    border: none;
  }

  button.zero { grid-column: span 2; }

  .layout {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .history-panel {
    width: 240px;
    max-height: 494px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 18px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .history-header h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: #f0eefc;
  }

  .history-header button {
    height: auto;
    padding: 6px 12px;
    font-size: 12px;
    background: rgba(255, 255, 255, 0.08);
  }

  #history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #history-list li {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  #history-list li:hover { filter: brightness(1.3); }

  #history-list .expr {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: #b9b3d9;
  }

  #history-list .result {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    text-align: right;
  }

  .history-empty {
    color: #8b85ad;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="calculator">
      <div id="display">0</div>
      <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button onclick="appendDigit('7')">7</button>
        <button onclick="appendDigit('8')">8</button>
        <button onclick="appendDigit('9')">9</button>
        <button class="operator" onclick="appendOperator('-')">−</button>

        <button onclick="appendDigit('4')">4</button>
        <button onclick="appendDigit('5')">5</button>
        <button onclick="appendDigit('6')">6</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendDigit('1')">1</button>
        <button onclick="appendDigit('2')">2</button>
        <button onclick="appendDigit('3')">3</button>
        <button class="equals" onclick="calculate()">=</button>

        <button class="zero" onclick="appendDigit('0')">0</button>
        <button onclick="appendDigit('.')">.</button>
      </div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <h2>履歴</h2>
        <button onclick="clearHistory()">Clear</button>
      </div>
      <ul id="history-list"></ul>
      <div id="history-empty" class="history-empty">まだ計算履歴がありません</div>
    </div>
  </div>

<script>
  let expression = "";
  const HISTORY_KEY = "calculator-history";
  const HISTORY_LIMIT = 20;
  let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");

  function updateDisplay() {
    document.getElementById("display").textContent = expression || "0";
  }

  function renderHistory() {
    const list = document.getElementById("history-list");
    const empty = document.getElementById("history-empty");
    list.innerHTML = "";

    if (history.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    history.forEach((entry) => {
      const item = document.createElement("li");
      item.innerHTML = `<span class="expr">${entry.expr}</span><span class="result">${entry.result}</span>`;
      item.addEventListener("click", () => {
        expression = entry.result;
        updateDisplay();
      });
      list.appendChild(item);
    });
  }

  function addToHistory(expr, result) {
    history.unshift({ expr, result });
    history = history.slice(0, HISTORY_LIMIT);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistory();
  }

  function clearHistory() {
    history = [];
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  }

  function appendDigit(digit) {
    expression += digit;
    updateDisplay();
  }

  function appendOperator(operator) {
    if (expression === "") {
      if (operator === "-") {
        expression = "-";
        updateDisplay();
      }
      return;
    }
    const lastChar = expression[expression.length - 1];
    if ("+-*/".includes(lastChar)) {
      if (operator === "-" && lastChar !== "-") {
        expression += operator;
      } else {
        expression = expression.slice(0, -1) + operator;
      }
    } else {
      expression += operator;
    }
    updateDisplay();
  }

  function deleteLast() {
    expression = expression.slice(0, -1);
    updateDisplay();
  }

  function clearAll() {
    expression = "";
    updateDisplay();
  }

  function calculate() {
    if (expression === "") return;
    try {
      if (!/^[0-9+\-*/.]+$/.test(expression)) {
        throw new Error("invalid characters");
      }
      const originalExpression = expression;
      const result = Function(`"use strict"; return (${expression})`)();
      if (!isFinite(result)) throw new Error("division by zero");
      expression = String(result);
      updateDisplay();
      addToHistory(originalExpression, expression);
    } catch (error) {
      document.getElementById("display").textContent = "Error";
      expression = "";
    }
  }

  renderHistory();
</script>
</body>
</html>
